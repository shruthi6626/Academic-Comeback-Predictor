<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Academic Comeback Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon: #C98BA0;
    --maroon-deep: #A96B82;
    --gold: #FFDD8C;
    --gold-deep: #F5C556;
    --ink: #4A3B42;
    --cream: #FFF8EF;
    --white: #FFFFFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #FCE8EE 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #FFF3D6 0%, transparent 45%),
      var(--cream);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    overflow-x:hidden;
  }

  .app{
    width:100%;
    max-width:440px;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--white);
    border:2px solid var(--gold-deep);
    color:var(--maroon-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.06em;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .eyebrow .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--maroon);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(1.4);}
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:32px;
    line-height:1.15;
    margin:0 0 6px;
    color:var(--maroon-deep);
  }
  h1 span{color:var(--gold-deep);}

  .sub{
    font-size:15px;
    color:#8a7580;
    margin:0 0 24px;
    font-weight:600;
  }

  /* Viewfinder card */
  .scanner-card{
    position:relative;
    background:var(--ink);
    border-radius:28px;
    padding:14px;
    box-shadow:0 20px 40px -18px rgba(169,107,130,0.45);
  }

  .viewport{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    border-radius:20px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 40%, #5b4a53 0%, #3a2e34 70%, #2b2229 100%);
  }

  video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scaleX(-1);
  }

  .fallback-icon{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:10px;
    color:#c9b6bf;
  }
  .fallback-icon svg{width:64px;height:64px;opacity:0.55;}
  .fallback-icon p{
    margin:0; font-size:12.5px; font-weight:700;
    color:#c9b6bf; max-width:200px;
  }

  /* corner brackets */
  .bracket{
    position:absolute; width:34px; height:34px;
    border-color:var(--gold);
    border-style:solid;
    opacity:0.9;
  }
  .bracket.tl{top:14px;left:14px;border-width:4px 0 0 4px;border-top-left-radius:10px;}
  .bracket.tr{top:14px;right:14px;border-width:4px 4px 0 0;border-top-right-radius:10px;}
  .bracket.bl{bottom:14px;left:14px;border-width:0 0 4px 4px;border-bottom-left-radius:10px;}
  .bracket.br{bottom:14px;right:14px;border-width:0 4px 4px 0;border-bottom-right-radius:10px;}

  .scanline{
    position:absolute; left:6%; right:6%; height:3px;
    border-radius:3px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    box-shadow:0 0 14px 2px rgba(255,221,140,0.9);
    top:0;
    opacity:0;
  }
  .scanline.active{
    animation:scan 1.4s ease-in-out infinite;
    opacity:1;
  }
  @keyframes scan{
    0%{top:6%;}
    50%{top:92%;}
    100%{top:6%;}
  }

  .badge-percent{
    position:absolute;
    bottom:16px; left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.94);
    color:var(--maroon-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:15px;
    padding:6px 14px;
    border-radius:999px;
    opacity:0;
    transition:opacity .3s ease;
    white-space:nowrap;
  }
  .badge-percent.show{opacity:1;}

  /* Scan button */
  .scan-btn{
    margin-top:22px;
    width:100%;
    border:none;
    border-radius:18px;
    padding:16px 20px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.01em;
    color:var(--white);
    background:linear-gradient(135deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    box-shadow:0 10px 22px -8px rgba(169,107,130,0.6);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .scan-btn:hover{transform:translateY(-2px); box-shadow:0 14px 26px -8px rgba(169,107,130,0.7);}
  .scan-btn:active{transform:translateY(0px) scale(0.98);}
  .scan-btn:disabled{opacity:0.6; cursor:progress; transform:none;}

  /* Result */
  .result{
    margin-top:22px;
    background:var(--white);
    border-radius:22px;
    padding:26px 22px 22px;
    border:2px solid #FBE3C9;
    display:none;
    position:relative;
    overflow:hidden;
  }
  .result.show{display:block; animation:pop .45s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{
    0%{opacity:0; transform:translateY(10px) scale(0.96);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }

  .score-ring{
    width:128px; height:128px;
    margin:0 auto 14px;
    position:relative;
  }
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .track{fill:none; stroke:#FBE9DA; stroke-width:10;}
  .score-ring .progress{
    fill:none; stroke:url(#gradRing); stroke-width:10; stroke-linecap:round;
    transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1);
  }
  .score-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:28px;
    color:var(--maroon-deep);
  }

  .result-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin:0 0 6px;
  }

  .result-message{
    font-size:17px;
    font-weight:800;
    color:var(--maroon-deep);
    margin:0 0 6px;
    line-height:1.35;
  }

  .result-sub{
    font-size:13.5px;
    color:#9a8790;
    font-weight:600;
    margin:0;
  }

  .again-btn{
    margin-top:16px;
    background:transparent;
    border:2px solid var(--gold-deep);
    color:var(--maroon-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:14px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .again-btn:hover{background:#FFF3D6;}

  .confetti{
    position:absolute; top:-10px; border-radius:2px; pointer-events:none;
  }

  .footer-note{
    margin-top:18px;
    font-size:11.5px;
    color:#b6a3ac;
    font-weight:700;
  }
</style>
</head>
<body>

<div class="app">
  <div class="eyebrow"><span class="dot"></span>ASU CAMPUS TOOL</div>
  <h1>Academic Comeback <span>Scanner</span></h1>
  <p class="sub">Point, scan, and get your official comeback rating.</p>

  <div class="scanner-card">
    <div class="viewport" id="viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="fallback-icon" id="fallbackIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 8a2 2 0 0 1 2-2h2l1.2-1.6A2 2 0 0 1 10.8 3.6h2.4a2 2 0 0 1 1.6.8L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
        <p>Camera preview unavailable here — scan still works!</p>
      </div>
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>
      <div class="scanline" id="scanline"></div>
      <div class="badge-percent" id="liveBadge">analyzing...</div>
    </div>
  </div>

  <button class="scan-btn" id="scanBtn">Start Scan</button>

  <div class="result" id="result">
    <div class="score-ring">
      <svg viewBox="0 0 120 120" width="128" height="128">
        <defs>
          <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFDD8C"/>
            <stop offset="100%" stop-color="#C98BA0"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="60" cy="60" r="50"/>
        <circle class="progress" id="ring" cx="60" cy="60" r="50"
                stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
      </svg>
      <div class="score-num" id="scoreNum">0%</div>
    </div>
    <p class="result-label">Comeback Rating</p>
    <p class="result-message" id="resultMessage"></p>
    <p class="result-sub" id="resultSub"></p>
    <button class="again-btn" id="againBtn">Scan Again</button>
  </div>

  <p class="footer-note">Not a real diagnostic. 100% vibes-based. Go get 'em.</p>
</div>

<script>
const video = document.getElementById('video');
const fallbackIcon = document.getElementById('fallbackIcon');
const scanBtn = document.getElementById('scanBtn');
const scanline = document.getElementById('scanline');
const liveBadge = document.getElementById('liveBadge');
const resultBox = document.getElementById('result');
const scoreNum = document.getElementById('scoreNum');
const ring = document.getElementById('ring');
const resultMessage = document.getElementById('resultMessage');
const resultSub = document.getElementById('resultSub');
const againBtn = document.getElementById('againBtn');
const viewport = document.getElementById('viewport');

const RING_CIRC = 314.16;

// Try to start the camera; fall back gracefully if unavailable
async function initCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio:false });
    video.srcObject = stream;
    fallbackIcon.style.display = 'none';
  }catch(err){
    video.style.display = 'none';
    fallbackIcon.style.display = 'flex';
  }
}
initCamera();

const messages = [
  { min:60, max:69, lines:[
      ["You're rebuilding. Every rep counts.", "Small wins stack into big comebacks."],
      ["Rough patch, not a dead end.", "Show up tomorrow and stack another day."],
      ["The plot twist is loading.", "This is chapter one, not the finale."]
  ]},
  { min:70, max:79, lines:[
      ["Momentum: officially detected.", "Keep this pace and watch it compound."],
      ["You're closer than it feels.", "Consistency is quietly doing its job."],
      ["Solid ground under your feet.", "This is the part before the glow-up."]
  ]},
  { min:80, max:89, lines:[
      ["Certified upward trajectory.", "Whatever you're doing, keep doing it."],
      ["You're in main-character-arc mode.", "The comeback is very much underway."],
      ["Sharp focus, strong signal.", "Professors are taking notes on you now."]
  ]},
  { min:90, max:100, lines:[
      ["Peak comeback energy detected.", "Frame this moment. Then go study anyway."],
      ["Certified legend status.", "You didn't just bounce back, you levitated."],
      ["Off the charts, on your grind.", "This is the highlight reel version of you."]
  ]}
];

function pickMessage(score){
  const bucket = messages.find(m => score >= m.min && score <= m.max) || messages[0];
  const pair = bucket.lines[Math.floor(Math.random()*bucket.lines.length)];
  return pair;
}

function fireConfetti(){
  const colors = ['#FFDD8C','#C98BA0','#FBE9DA','#F5C556','#E8B7C6'];
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const size = 5 + Math.random()*6;
    el.style.width = size+'px';
    el.style.height = (size*0.5)+'px';
    el.style.left = (Math.random()*100)+'%';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    resultBox.appendChild(el);
    const dur = 900 + Math.random()*700;
    el.animate([
      { transform: el.style.transform, top:'-10px', opacity:1 },
      { transform: `rotate(${Math.random()*720}deg)`, top: '260px', opacity:0 }
    ], { duration: dur, easing:'cubic-bezier(.2,.6,.4,1)' });
    setTimeout(()=> el.remove(), dur+50);
  }
}

function runScan(){
  scanBtn.disabled = true;
  scanBtn.textContent = 'Scanning...';
  resultBox.classList.remove('show');
  scanline.classList.add('active');
  liveBadge.classList.add('show');

  let tick = 0;
  const badgeTimer = setInterval(()=>{
    tick++;
    liveBadge.textContent = 'analyzing' + '.'.repeat((tick % 3)+1);
  }, 260);

  setTimeout(()=>{
    clearInterval(badgeTimer);
    scanline.classList.remove('active');
    liveBadge.classList.remove('show');

    const score = Math.floor(60 + Math.random()*41); // 60–100
    const [line1, line2] = pickMessage(score);

    scoreNum.textContent = score + '%';
    resultMessage.textContent = line1;
    resultSub.textContent = line2;

    const offset = RING_CIRC - (RING_CIRC * score / 100);
    ring.style.strokeDashoffset = RING_CIRC;
    requestAnimationFrame(()=>{
      ring.style.strokeDashoffset = offset;
    });

    resultBox.classList.add('show');
    fireConfetti();

    scanBtn.disabled = false;
    scanBtn.textContent = 'Scan Again';
  }, 1900);
}

scanBtn.addEventListener('click', runScan);
againBtn.addEventListener('click', runScan);
</script>

</body>
</html>
